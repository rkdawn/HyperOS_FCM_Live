pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // libsu (root shell for the diagnostics page) publishes only here.
        maven { url 'https://jitpack.io'; content { includeGroup 'com.github.topjohnwu.libsu' } }
        mavenLocal {
            content {
                includeGroup("io.github.libxposed")
            }
        }
    }
}
rootProject.name = "HyperFCMLive"
include ':HyperFCMLive'
include ':hiddenapi:stubs'
